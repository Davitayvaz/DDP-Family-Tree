<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Family Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EDE6D6;
    --paper-light: #F7F2E7;
    --ink: #2B2420;
    --ink-soft: #6B5F52;
    --pine: #3D5A45;
    --pine-dark: #26362C;
    --berry: #7A3B3B;
    --card: #FBF7EE;
    --border: #D8CBB0;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ font-family:'Inter', system-ui, sans-serif; background:var(--paper); color:var(--ink); }

  .toolbar{ display:flex; align-items:center; justify-content:space-between; padding:14px 22px; background:var(--pine-dark); color:var(--paper-light); position:sticky; top:0; z-index:30; flex-wrap:wrap; gap:10px; }
  .brand{ font-family:'Fraunces', Georgia, serif; font-size:20px; font-weight:600; letter-spacing:.02em; margin:0; }
  .toolbar-actions{ display:flex; gap:10px; flex-wrap:wrap; }
  button, .file-btn{ font-family:inherit; font-size:13px; font-weight:600; padding:8px 14px; border-radius:6px; border:1px solid transparent; cursor:pointer; background:var(--paper-light); color:var(--pine-dark); transition: background .15s ease, transform .1s ease; }
  button:hover, .file-btn:hover{ background:#fff; transform:translateY(-1px); }
  button.danger{ background:transparent; border-color:rgba(255,255,255,.4); color:var(--paper-light); }
  button.danger:hover{ background:var(--berry); border-color:var(--berry); color:#fff; }
  .file-btn{ position:relative; overflow:hidden; display:inline-block; }
  /* visually-hidden file input trick so iOS Safari's picker still works */
  .file-btn input[type=file]{ position:absolute; inset:0; opacity:0; cursor:pointer; }

  .hint-bar{ padding:8px 22px; font-size:12.5px; color:var(--ink-soft); background:var(--paper-light); border-bottom:1px solid var(--border); }

  .viewport{ height:calc(100vh - 92px); overflow:auto; background-image: radial-gradient(circle, var(--border) 1px, transparent 1px); background-size:22px 22px; }
  .canvas{ position:relative; width:3000px; height:2000px; }
  .empty-hint{ position:absolute; top:40px; left:40px; font-family:'Fraunces',serif; font-style:italic; color:var(--ink-soft); font-size:16px; pointer-events:none; }

  svg#edgesLayer{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; }
  .edge-line{ stroke:var(--pine); stroke-width:2.5; fill:none; }
  .edge-hit{ stroke:transparent; stroke-width:16; fill:none; pointer-events:stroke; cursor:pointer; }
  .edge-temp{ stroke:var(--pine); stroke-width:2; stroke-dasharray:5 5; fill:none; }
  g.selected .edge-line{ stroke:var(--berry); stroke-width:3; }
  .edge-delete{ cursor:pointer; pointer-events:all; }
  .edge-delete circle{ fill:var(--berry); }
  .edge-delete text{ fill:#fff; font-size:13px; font-family:inherit; }

  .node{ position:absolute; width:170px; min-height:76px; background:var(--card); border:1.5px solid var(--border); border-radius:8px; padding:10px 12px; box-shadow:0 1px 3px rgba(43,36,32,.12); cursor:grab; }
  .node.dragging{ cursor:grabbing; box-shadow:0 6px 16px rgba(43,36,32,.2); }
  .node-name{ font-family:'Fraunces',serif; font-weight:600; font-size:15px; line-height:1.3; outline:none; }
  .node-name.editing, .node-note.editing{ background:#fff; box-shadow:0 0 0 2px var(--pine) inset; border-radius:3px; }
  .node-note{ font-size:12px; color:var(--ink-soft); margin-top:3px; outline:none; min-height:14px; }
  .node-note:empty::before{ content:attr(data-placeholder); color:#B9AD97; font-style:italic; }
  .node-delete{ position:absolute; top:-8px; right:-8px; width:20px; height:20px; border-radius:50%; border:none; background:var(--berry); color:#fff; font-size:13px; line-height:1; cursor:pointer; opacity:0; transition:opacity .15s ease; padding:0; }
  .node:hover .node-delete{ opacity:1; }
  .handle{ position:absolute; width:14px; height:14px; border-radius:50%; background:var(--pine); border:2px solid var(--paper-light); left:50%; transform:translateX(-50%); cursor:crosshair; }
  .handle-bottom{ bottom:-7px; }
  .handle:hover{ background:var(--pine-dark); }

  @media print{
    .toolbar, .hint-bar{ display:none; }
    .viewport{ height:auto; overflow:visible; background-image:none; }
    .node{ box-shadow:none; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .handle, .node-delete, .edge-delete{ display:none; }
    .empty-hint{ display:none; }
    @page{ size:landscape; margin:12mm; }
  }
</style>
</head>
<body>

<header class="toolbar">
  <h1 class="brand">🌳 Family Tree</h1>
  <div class="toolbar-actions">
    <button id="btnAdd">+ Add person</button>
    <button id="btnSave">Save file</button>
    <label class="file-btn">Load file<input type="file" id="fileInput" accept=".json" /></label>
    <button id="btnPrint">Print</button>
    <button id="btnClear" class="danger">Clear all</button>
  </div>
</header>
<div class="hint-bar">Double-click anywhere on the paper to add a person &nbsp;•&nbsp; drag the green dot below a card down onto another card to connect parent → child &nbsp;•&nbsp; click a line to delete it &nbsp;•&nbsp; your tree saves automatically in this browser</div>

<main class="viewport" id="viewport">
  <div class="canvas" id="canvas">
    <svg id="edgesLayer"></svg>
    <p class="empty-hint" id="emptyHint">Double-click here to add your first family member</p>
  </div>
</main>

<script>
  // ---------- state ----------
  const STORAGE_KEY = 'familyTreeData_v1';
  const NODE_W = 170, NODE_H = 76; // default size, used only for initial placement

  let state = { nodes: [], edges: [], nextId: 1 };

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        if(parsed && Array.isArray(parsed.nodes) && Array.isArray(parsed.edges)){
          state = parsed;
          if(typeof state.nextId !== 'number') state.nextId = state.nodes.length + state.edges.length + 1;
        }
      }
    }catch(e){ console.warn('Could not load saved tree', e); }
  }
  function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

  // ---------- DOM refs ----------
  const viewport = document.getElementById('viewport');
  const canvas = document.getElementById('canvas');
  const edgesSvg = document.getElementById('edgesLayer');
  const emptyHint = document.getElementById('emptyHint');
  const btnAdd = document.getElementById('btnAdd');
  const btnSave = document.getElementById('btnSave');
  const btnPrint = document.getElementById('btnPrint');
  const btnClear = document.getElementById('btnClear');
  const fileInput = document.getElementById('fileInput');

  function escapeHtml(str){
    return (str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- rendering ----------
  function render(){
    canvas.querySelectorAll('.node').forEach(n => n.remove());
    edgesSvg.innerHTML = '';
    emptyHint.style.display = state.nodes.length ? 'none' : 'block';
    state.nodes.forEach(drawNode);
    drawAllEdges();
  }

  function drawNode(node){
    const el = document.createElement('div');
    el.className = 'node';
    el.dataset.id = node.id;
    el.style.left = node.x + 'px';
    el.style.top = node.y + 'px';
    el.innerHTML = `
      <button class="node-delete" title="Delete person">×</button>
      <div class="node-name" spellcheck="false">${escapeHtml(node.name)}</div>
      <div class="node-note" spellcheck="false" data-placeholder="year or note">${escapeHtml(node.note || '')}</div>
      <div class="handle handle-bottom" title="Drag to connect a child"></div>
    `;
    canvas.appendChild(el);

    el.addEventListener('mousedown', e => {
      if(e.target.closest('.handle') || e.target.closest('.node-delete') || e.target.isContentEditable) return;
      startNodeDrag(e, node, el);
    });
    el.querySelector('.node-delete').addEventListener('click', e => { e.stopPropagation(); deleteNode(node.id); });

    const nameEl = el.querySelector('.node-name');
    nameEl.addEventListener('dblclick', e => { e.stopPropagation(); enterEdit(nameEl, node, 'name'); });
    const noteEl = el.querySelector('.node-note');
    noteEl.addEventListener('dblclick', e => { e.stopPropagation(); enterEdit(noteEl, node, 'note'); });

    el.querySelector('.handle-bottom').addEventListener('mousedown', e => {
      e.stopPropagation();
      startConnectionDrag(e, node);
    });
  }

  function enterEdit(el, node, field){
    el.contentEditable = 'true';
    el.classList.add('editing');
    el.focus();
    document.execCommand('selectAll', false, null);
    function finish(){
      el.contentEditable = 'false';
      el.classList.remove('editing');
      node[field] = el.textContent.trim();
      saveState();
      el.removeEventListener('blur', finish);
      el.removeEventListener('keydown', keyHandler);
    }
    function keyHandler(ev){ if(ev.key === 'Enter'){ ev.preventDefault(); el.blur(); } }
    el.addEventListener('blur', finish);
    el.addEventListener('keydown', keyHandler);
  }

  // ---------- node dragging ----------
  function startNodeDrag(e, node, el){
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const offsetX = e.clientX - rect.left - node.x;
    const offsetY = e.clientY - rect.top - node.y;
    el.classList.add('dragging');
    function onMove(ev){
      const r = canvas.getBoundingClientRect();
      node.x = Math.max(0, ev.clientX - r.left - offsetX);
      node.y = Math.max(0, ev.clientY - r.top - offsetY);
      el.style.left = node.x + 'px';
      el.style.top = node.y + 'px';
      drawAllEdges();
    }
    function onUp(){
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      el.classList.remove('dragging');
      saveState();
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }

  // ---------- edges ----------
  function nodeEl(node){ return canvas.querySelector(`.node[data-id="${node.id}"]`); }
  function nodeCenterBottom(node){
    const el = nodeEl(node); const w = el ? el.offsetWidth : NODE_W, h = el ? el.offsetHeight : NODE_H;
    return { x: node.x + w/2, y: node.y + h };
  }
  function nodeCenterTop(node){
    const el = nodeEl(node); const w = el ? el.offsetWidth : NODE_W;
    return { x: node.x + w/2, y: node.y };
  }

  function drawAllEdges(){
    edgesSvg.innerHTML = '';
    state.edges.forEach(drawEdge);
  }

  function pathFor(p0, p2){
    const midY = (p0.y + p2.y) / 2;
    return `M ${p0.x} ${p0.y} C ${p0.x} ${midY}, ${p2.x} ${midY}, ${p2.x} ${p2.y}`;
  }

  function drawEdge(edge){
    const from = state.nodes.find(n => n.id === edge.from);
    const to = state.nodes.find(n => n.id === edge.to);
    if(!from || !to) return;
    const d = pathFor(nodeCenterBottom(from), nodeCenterTop(to));
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.dataset.id = edge.id;
    const hit = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    hit.setAttribute('d', d); hit.setAttribute('class', 'edge-hit');
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    line.setAttribute('d', d); line.setAttribute('class', 'edge-line');
    g.appendChild(line); g.appendChild(hit);
    hit.addEventListener('click', e => { e.stopPropagation(); selectEdge(edge); });
    edgesSvg.appendChild(g);
  }

  let selectedEdgeId = null;
  function selectEdge(edge){
    clearEdgeSelection();
    selectedEdgeId = edge.id;
    const g = edgesSvg.querySelector(`g[data-id="${edge.id}"]`);
    if(!g) return;
    g.classList.add('selected');
    const line = g.querySelector('.edge-line');
    const len = line.getTotalLength();
    const mid = line.getPointAtLength(len / 2);
    const btn = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    btn.setAttribute('class', 'edge-delete');
    btn.setAttribute('transform', `translate(${mid.x - 10},${mid.y - 10})`);
    btn.innerHTML = `<circle cx="10" cy="10" r="10"></circle><text x="10" y="14" text-anchor="middle">×</text>`;
    btn.addEventListener('click', e => { e.stopPropagation(); deleteEdge(edge.id); });
    g.appendChild(btn);
  }
  function clearEdgeSelection(){
    edgesSvg.querySelectorAll('.edge-delete').forEach(b => b.remove());
    edgesSvg.querySelectorAll('g.selected').forEach(g => g.classList.remove('selected'));
    selectedEdgeId = null;
  }
  viewport.addEventListener('mousedown', e => {
    if(!e.target.closest('.edge-hit') && !e.target.closest('.edge-delete')) clearEdgeSelection();
  });

  function deleteEdge(id){ state.edges = state.edges.filter(e => e.id !== id); saveState(); drawAllEdges(); }
  function edgeExists(a, b){ return state.edges.some(e => e.from === a && e.to === b); }

  function deleteNode(id){
    state.nodes = state.nodes.filter(n => n.id !== id);
    state.edges = state.edges.filter(e => e.from !== id && e.to !== id);
    saveState(); render();
  }

  // ---------- creating new connections ----------
  function startConnectionDrag(e, fromNode){
    const start = nodeCenterBottom(fromNode);
    const tempLine = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    tempLine.setAttribute('class', 'edge-temp');
    edgesSvg.appendChild(tempLine);
    function onMove(ev){
      const rect = canvas.getBoundingClientRect();
      const x = ev.clientX - rect.left, y = ev.clientY - rect.top;
      tempLine.setAttribute('d', pathFor(start, { x, y }));
    }
    function onUp(ev){
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      tempLine.remove();
      const target = document.elementFromPoint(ev.clientX, ev.clientY);
      const targetNodeEl = target && target.closest ? target.closest('.node') : null;
      if(targetNodeEl){
        const toId = targetNodeEl.dataset.id;
        if(toId !== fromNode.id && !edgeExists(fromNode.id, toId)){
          state.edges.push({ id: 'e' + (state.nextId++), from: fromNode.id, to: toId });
          saveState(); drawAllEdges();
        }
      }
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }

  // ---------- adding people ----------
  function addNode(x, y, name = 'New person'){
    const node = { id: 'n' + (state.nextId++), x, y, name, note: '' };
    state.nodes.push(node);
    saveState(); render();
    requestAnimationFrame(() => {
      const el = nodeEl(node);
      const nameEl = el && el.querySelector('.node-name');
      if(nameEl) enterEdit(nameEl, node, 'name');
    });
    return node;
  }

  canvas.addEventListener('dblclick', e => {
    if(e.target.closest('.node')) return;
    const rect = canvas.getBoundingClientRect();
    const x = Math.max(0, e.clientX - rect.left - NODE_W / 2);
    const y = Math.max(0, e.clientY - rect.top - NODE_H / 2);
    addNode(x, y);
  });

  btnAdd.addEventListener('click', () => {
    const x = viewport.scrollLeft + viewport.clientWidth / 2 - NODE_W / 2;
    const y = viewport.scrollTop + viewport.clientHeight / 2 - NODE_H / 2;
    addNode(Math.max(0, x), Math.max(0, y));
  });

  // ---------- save / load ----------
  btnSave.addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'family-tree.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  });

  fileInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = JSON.parse(reader.result);
        if(parsed && Array.isArray(parsed.nodes) && Array.isArray(parsed.edges)){
          state = parsed;
          if(typeof state.nextId !== 'number') state.nextId = state.nodes.length + state.edges.length + 1;
          saveState(); render();
        } else {
          alert('That file does not look like a family tree export.');
        }
      }catch(err){ alert('Could not read that file: ' + err.message); }
    };
    reader.readAsText(file);
    fileInput.value = '';
  });

  btnClear.addEventListener('click', () => {
    if(confirm('Clear the entire tree? This cannot be undone unless you saved a file first.')){
      state = { nodes: [], edges: [], nextId: 1 };
      saveState(); render();
    }
  });

  // ---------- printing ----------
  function preparePrint(){
    if(!state.nodes.length) return;
    let maxX = 0, maxY = 0;
    state.nodes.forEach(n => {
      const el = nodeEl(n);
      const w = el ? el.offsetWidth : NODE_W, h = el ? el.offsetHeight : NODE_H;
      maxX = Math.max(maxX, n.x + w);
      maxY = Math.max(maxY, n.y + h);
    });
    canvas.style.width = (maxX + 60) + 'px';
    canvas.style.height = (maxY + 60) + 'px';
  }
  function restoreAfterPrint(){
    canvas.style.width = '';
    canvas.style.height = '';
  }
  window.addEventListener('beforeprint', preparePrint);
  window.addEventListener('afterprint', restoreAfterPrint);
  btnPrint.addEventListener('click', () => window.print());

  // ---------- init ----------
  loadState();
  render();
</script>
</body>
</html>
